{% extends "base.html" %}

{% block title %}Материалы — Учет материалов ИП{% endblock %}

{% block content %}
<header class="page-heading">
    <div>
        <p class="section-label mb-1">Склад</p>
        <h1 class="h2 mb-0">Материалы</h1>
    </div>
    <span class="badge text-bg-dark">
        Позиций: {{ materials|length }}
    </span>
</header>

<form method="get" class="filter-bar mb-4">
    <div>
        <label class="form-label" for="material-search">Название</label>
        <input class="form-control" id="material-search" name="q" value="{{ q }}" type="search">
    </div>
    <div>
        <label class="form-label" for="minimum-stock">Остаток не менее</label>
        <input class="form-control" id="minimum-stock" name="quantity" value="{{ quantity }}" type="number" min="0" step="any">
    </div>
    <button class="btn btn-success" type="submit"><i class="bi bi-search me-2"></i>Найти</button>
    <a class="btn btn-outline-secondary" href="{% url 'materials_web:materials' %}">Сбросить</a>
</form>
{% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
{% include "materials_web/includes/material_table.html" %}
{% endblock %}
