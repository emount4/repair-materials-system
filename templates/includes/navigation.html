{% load static %}
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
    <div class="container page-shell">
        <a class="navbar-brand fw-semibold" href="{% url 'homepage:index' %}">
            <img
                class="brand-logo"
                src="{% static 'homepage/img/logo.svg' %}"
                alt=""
            >
            {{ inventory_title }} · {{ inventory_material_count }}
        </a>
        <div class="navbar-nav flex-row flex-wrap gap-2 gap-md-3">
            <a class="nav-link" href="{% url 'homepage:index' %}">
                Главная
            </a>
            <a class="nav-link" href="{% url 'materials_web:materials' %}">
                Материалы
            </a>
            <a class="nav-link" href="{% url 'operations_web:operations' %}">
                Операции
            </a>
            <a class="nav-link" href="{% url 'materials_web:available' %}">
                Подбор
            </a>
            <a class="nav-link" href="{% url 'homepage:statistics' %}">
                Статистика
            </a>
        </div>
    </div>
</nav>
<div class="container page-shell d-flex justify-content-end py-2">
    {% if user.is_authenticated %}
        <span class="me-3">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary" type="submit">Выйти</button></form>
    {% else %}<a href="{% url 'login' %}">Войти</a>{% endif %}
</div>
