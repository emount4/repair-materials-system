{% extends "base.html" %}
{% block title %}{{ title }} — Материалы ИП{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ title }}</h1>
<form method="post" class="editor-form">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="mb-3">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-success" type="submit"><i class="bi bi-check-lg me-2"></i>Сохранить</button>
        <a class="btn btn-outline-secondary" href="{% url back_url %}">Назад</a>
    </div>
</form>
{% endblock %}
