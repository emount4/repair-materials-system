{% if page_obj.paginator.num_pages > 1 %}
<nav class="d-flex gap-3 align-items-center mt-3" aria-label="Страницы журнала">
    {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" aria-label="Предыдущая страница"><i class="bi bi-arrow-left"></i></a>{% endif %}
    <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" aria-label="Следующая страница"><i class="bi bi-arrow-right"></i></a>{% endif %}
</nav>
{% endif %}
