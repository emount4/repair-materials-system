{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Учет материалов ИП{% endblock %}</title>
    <link rel="icon" href="{% static 'homepage/img/logo.svg' %}">
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container page-shell py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container page-shell py-3">
            <span>Учет материалов ИП</span>
            <span>© <span id="current-year"></span></span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
